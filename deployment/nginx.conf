# Reference reverse-proxy config for a single-host production deployment.
# Terminates TLS, routes /api/, /admin/, /dashboard/, /static/, /media/ to
# the Django backend container, and everything else to the Next.js
# frontend container. Adjust upstream ports if you change docker-compose.

upstream syntrix_frontend {
    server 127.0.0.1:3000;
}

upstream syntrix_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name syntrixdigitalsolutions.com www.syntrixdigitalsolutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name syntrixdigitalsolutions.com www.syntrixdigitalsolutions.com;

    # ssl_certificate     /etc/letsencrypt/live/syntrixdigitalsolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/syntrixdigitalsolutions.com/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://syntrix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://syntrix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard/ {
        proxy_pass http://syntrix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/syntrix/backend/staticfiles/;
        expires 30d;
    }

    # Job-application resumes are user-uploaded and must never be rendered
    # inline (defense in depth alongside the backend's extension/content
    # validation) — force download with a locked-down content type.
    location /media/applications/resumes/ {
        alias /srv/syntrix/backend/media/applications/resumes/;
        expires 7d;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        default_type application/octet-stream;
    }

    location /media/ {
        alias /srv/syntrix/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://syntrix_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
